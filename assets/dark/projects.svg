<svg viewBox="0 0 1000 365" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three projects by Vaibhav Verma">
  <style>
    :root { --ink:#000000; --paper:#FFFFFF; }
    @media (prefers-color-scheme:dark) { :root { --ink:#FFFFFF; --paper:#000000; } }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .row { opacity:0; animation:reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .rule { stroke:var(--ink); stroke-width:1; }
    .title { fill:var(--ink); font-size:20px; font-weight:700; letter-spacing:.8px; }
    .copy { fill:var(--ink); font-size:16px; }
    .meta { fill:var(--ink); font-size:11px; letter-spacing:.4px; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.10s}.r3{animation-delay:.15s}.r4{animation-delay:.20s}.r5{animation-delay:.25s}
    .r6{animation-delay:.30s}.r7{animation-delay:.35s}.r8{animation-delay:.40s}.r9{animation-delay:.45s}.r10{animation-delay:.50s}
    .r11{animation-delay:.55s}.r12{animation-delay:.60s}.r13{animation-delay:.65s}.r14{animation-delay:.70s}.r15{animation-delay:.75s}
    @media (prefers-reduced-motion:reduce) { .row { animation:none; opacity:1; } }
  :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --node-bg:#000000; --core-bg:#000000; --ghost:#FFFFFF; --ink:#FFFFFF; --paper:#000000; --ghost:#FFFFFF; }
  </style>

  <g class="mono">
    <g class="row r1" transform="translate(0 20)">
      <text class="title" x="48" y="24" font-size="20">01 / ORYN</text>
      <text class="copy" x="48" y="49" font-size="16">Enterprise knowledge RAG engine — ask questions over uploaded documents and get answers with source citations.</text>
      <text class="copy" x="48" y="68" font-size="16">Hybrid Pinecone + PostgreSQL search, Cohere reranking, multi-tenant RBAC workspaces, streaming and eval analytics.</text>
      <text class="meta" x="48" y="87" font-size="11">REACT · TYPESCRIPT · PYTHON · FASTAPI · POSTGRESQL · PINECONE · OPENAI · COHERE</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r2" transform="translate(0 130)">
      <text class="title" x="48" y="24" font-size="20">02 / NEXIS</text>
      <text class="copy" x="48" y="49" font-size="16">AI agent &amp; workflow automation platform — build autonomous agents that run multi-step tasks with LangGraph.</text>
      <text class="copy" x="48" y="68" font-size="16">OpenAI tool calling, custom REST tools, API key management, live SSE execution monitoring, approval-based tool runs.</text>
      <text class="meta" x="48" y="87" font-size="11">REACT · JAVASCRIPT · PYTHON · FASTAPI · POSTGRESQL · LANGGRAPH · OPENAI API</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r3" transform="translate(0 240)">
      <text class="title" x="48" y="24" font-size="20">03 / SYNAXYS</text>
      <text class="copy" x="48" y="49" font-size="16">AI code review &amp; GitHub intelligence platform — analyses pull requests for bugs, code quality and security issues.</text>
      <text class="copy" x="48" y="68" font-size="16">Evidence-backed findings with file refs, severity and confidence; GitHub App + webhooks; human-approved comments.</text>
      <text class="meta" x="48" y="87" font-size="11">REACT · JAVASCRIPT · PYTHON · FASTAPI · POSTGRESQL · LANGCHAIN · OPENAI API · PINECONE · GITHUB API</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
  </g>
</svg>
